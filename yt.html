<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Audio Downloader VIP</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-6">
        <!-- Header -->
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold tracking-tight text-indigo-400">YouTube Audio Downloader</h1>
            <p class="text-xs text-slate-400">Máxima calidad disponible (Opus/MP3 320kbps) - Ultra baja latencia</p>
        </div>

        <!-- Formulario -->
        <div class="space-y-4">
            <div>
                <label for="url" class="block text-xs font-medium text-slate-300 mb-1">URL del Video de YouTube</label>
                <input type="url" id="url" placeholder="https://www.youtube.com/watch?v=..." 
                    class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition text-slate-100 placeholder-slate-600">
            </div>

            <button onclick="descargarAudio()" id="btn-descargar" 
                class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] font-semibold text-sm rounded-xl transition duration-150 flex items-center justify-center space-x-2 shadow-lg shadow-indigo-600/20">
                <span id="btn-text">Descargar Audio Máxima Calidad</span>
                <div id="spinner" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
            </button>
        </div>

        <!-- Estado / Mensajes -->
        <div id="status" class="hidden text-center text-xs p-3 rounded-xl border"></div>
    </div>

    <script>
        async function descargarAudio() {
            const urlInput = document.getElementById('url').value.trim();
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('spinner');
            const btn = document.getElementById('btn-descargar');
            const status = document.getElementById('status');

            if (!urlInput) {
                mostrarEstado("Por favor, ingresa una URL válida.", "error");
                return;
            }

            // Estado de carga
            btn.disabled = true;
            btnText.textContent = "Procesando en cliente...";
            spinner.classList.remove('hidden');
            status.classList.add('hidden');

            try {
                // Petición directa desde el navegador (Client-side) a API de extracción de alta velocidad
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: urlInput,
                        isAudioOnly: true,
                        aFormat: "best", // Solicita la máxima calidad nativa sin re-compresión innecesaria
                        filenamePattern: "basic"
                    })
                });

                const data = await response.json();

                if (data.status === 'stream' || data.status === 'redirect') {
                    mostrarEstado("¡Audio extraído con éxito! Iniciando descarga...", "exito");
                    // Forzar la descarga en el cliente
                    const a = document.createElement('a');
                    a.href = data.url;
                    a.download = '';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                } else {
                    throw new Error(data.text || "No se pudo procesar el video.");
                }
            } catch (error) {
                mostrarEstado("Error: " + error.message, "error");
            } finally {
                // Restaurar botón
                btn.disabled = false;
                btnText.textContent = "Descargar Audio Máxima Calidad";
                spinner.classList.add('hidden');
            }
        }

        function mostrarEstado(mensaje, tipo) {
            const status = document.getElementById('status');
            status.textContent = mensaje;
            status.classList.remove('hidden', 'bg-red-500/10', 'border-red-500/20', 'text-red-400', 'bg-emerald-500/10', 'border-emerald-500/20', 'text-emerald-400');
            
            if (tipo === 'error') {
                status.classList.add('bg-red-500/10', 'border-red-500/20', 'text-red-400');
            } else {
                status.classList.add('bg-emerald-500/10', 'border-emerald-500/20', 'text-emerald-400');
            }
        }
    </script>
</body>
</html>
