<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compresor Masivo e Individual a WebP - Studio Ultra</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- DaisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- JSZip & FileSaver -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        .dropzone-active {
            border-color: hsl(var(--p)) !important;
            background-color: hsl(var(--b2) / 0.8) !important;
        }
    </style>
</head>

<body class="h-screen bg-base-300 text-base-content flex overflow-hidden" x-data="compressorApp()">

    <!-- SIDEBAR LATERAL -->
    <aside class="w-72 shrink-0 bg-base-100 border-r border-base-200 flex flex-col overflow-hidden">

        <div class="px-4 py-3 border-b border-base-200 shrink-0">
            <h1 class="text-sm font-bold flex items-center gap-2">
                <i class="fa-solid fa-file-image text-primary"></i> Compresor WebP
            </h1>
        </div>

        <div class="flex-1 overflow-y-auto p-3 space-y-3">

            <!-- Estadísticas -->
            <div class="stats stats-vertical bg-base-200 shadow-none w-full border border-base-300">
                <div class="stat py-1.5 px-3">
                    <div class="stat-title text-[10px]">Imágenes</div>
                    <div class="stat-value text-base text-primary font-mono" x-text="fileItems.length">0</div>
                </div>
                <div class="stat py-1.5 px-3">
                    <div class="stat-title text-[10px]">Peso Original</div>
                    <div class="stat-value text-base font-mono" x-text="formatBytes(totalOriginalSize)">0 MB</div>
                </div>
                <div class="stat py-1.5 px-3">
                    <div class="stat-title text-[10px]">Peso WebP</div>
                    <div class="stat-value text-base text-success font-mono" x-text="formatBytes(totalCompressedSize)">0
                        MB</div>
                </div>
                <div class="stat py-1.5 px-3">
                    <div class="stat-title text-[10px]">Ahorro</div>
                    <div class="stat-value text-base text-secondary font-mono" x-text="totalSavings + '%'">0%</div>
                </div>
            </div>

            <!-- Ajustes Globales -->
            <div class="card bg-base-200 rounded-xl border border-base-300 p-3 space-y-3">
                <h2 class="text-[11px] font-bold uppercase tracking-wider text-primary flex items-center gap-1.5">
                    <i class="fa-solid fa-sliders"></i> Ajustes Globales
                </h2>

                <div class="space-y-1">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-semibold">Calidad WebP</label>
                        <span class="badge badge-primary badge-sm font-mono text-[10px]"
                            x-text="globalQuality + '%'">82%</span>
                    </div>
                    <input type="range" min="10" max="100" x-model.number="globalQuality"
                        class="range range-primary range-xs w-full" />
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold block">Redimensión Inicial</label>
                    <div class="form-control gap-0.5">
                        <label class="label cursor-pointer justify-start gap-2 py-0.5 min-h-0">
                            <input type="radio" value="original" x-model="globalResizeMode"
                                class="radio radio-primary radio-xs" />
                            <span class="label-text text-[11px]">Original (100%)</span>
                        </label>
                        <label class="label cursor-pointer justify-start gap-2 py-0.5 min-h-0">
                            <input type="radio" value="percent" x-model="globalResizeMode"
                                class="radio radio-primary radio-xs" />
                            <span class="label-text text-[11px]">Porcentaje (%)</span>
                        </label>
                        <label class="label cursor-pointer justify-start gap-2 py-0.5 min-h-0">
                            <input type="radio" value="custom" x-model="globalResizeMode"
                                class="radio radio-primary radio-xs" />
                            <span class="label-text text-[11px]">Personalizado (px)</span>
                        </label>
                    </div>
                </div>

                <div x-show="globalResizeMode === 'percent'" class="space-y-1">
                    <label class="text-xs font-semibold">Porcentaje de Escala</label>
                    <div class="join w-full">
                        <input type="number" x-model.number="globalPercent" min="1" max="200"
                            class="input input-bordered input-sm w-full join-item font-mono" />
                        <span class="btn btn-sm join-item border-base-300">%</span>
                    </div>
                </div>

                <div x-show="globalResizeMode === 'custom'" class="space-y-1">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-semibold">Ancho × Alto</label>
                        <button type="button" @click="globalKeepAspect = !globalKeepAspect"
                            class="btn btn-xs btn-ghost text-primary gap-1">
                            <i class="fa-solid" :class="globalKeepAspect ? 'fa-lock' : 'fa-lock-open'"></i>
                        </button>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <input type="number" x-model.number="globalCustomWidth" placeholder="Ancho"
                            class="input input-bordered input-sm w-full font-mono" />
                        <span class="text-xs font-bold text-base-content/40">×</span>
                        <input type="number" x-model.number="globalCustomHeight" placeholder="Alto"
                            class="input input-bordered input-sm w-full font-mono" />
                    </div>
                </div>

                <div x-show="globalResizeMode === 'original'" class="text-[11px] text-base-content/60 italic">
                    <i class="fa-solid fa-info-circle mr-1"></i> Respetará el tamaño nativo.
                </div>
            </div>

            <!-- Acciones -->
            <div class="space-y-2">
                <button @click="applyGlobalToAllFiles()" class="btn btn-outline btn-primary btn-sm w-full gap-2"
                    :disabled="fileItems.length === 0">
                    <i class="fa-solid fa-arrows-rotate"></i> Aplicar Globales
                </button>
                <button @click="downloadAllZIP()" class="btn btn-success text-white btn-sm w-full gap-2"
                    :disabled="!hasDoneItems">
                    <i class="fa-solid fa-file-zipper"></i> Descargar ZIP
                </button>
                <button @click="clearAll()" class="btn btn-ghost btn-sm w-full gap-2 text-error">
                    <i class="fa-solid fa-trash"></i> Limpiar Todo
                </button>
            </div>

        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 overflow-y-auto p-4 space-y-3">

        <!-- DROPZONE / SUBIDA -->
        <div class="border-2 border-dashed border-base-content/20 bg-base-100 rounded-2xl p-5 text-center cursor-pointer transition-all hover:border-primary hover:bg-base-200/50 group"
            :class="{ 'dropzone-active': isDropzoneActive }" @click="$refs.fileInput.click()"
            @dragover.prevent="isDropzoneActive = true" @dragleave.prevent="isDropzoneActive = false"
            @drop.prevent="isDropzoneActive = false; handleFilesAdded($event.dataTransfer.files)">

            <input type="file" x-ref="fileInput" @change="handleFilesAdded($event.target.files)" multiple
                accept="image/*" class="hidden" />
            <div class="space-y-2 pointer-events-none">
                <div
                    class="w-12 h-12 bg-primary/10 text-primary rounded-full flex items-center justify-center mx-auto group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-cloud-arrow-up text-xl"></i>
                </div>
                <div>
                    <p class="font-bold text-sm">Arrastra imágenes aquí o haz clic</p>
                    <p class="text-[11px] text-base-content/60 mt-0.5">PNG, JPG, JPEG, WEBP, AVIF, GIF, BMP, SVG...</p>
                </div>
            </div>
        </div>

        <!-- LISTA DE ARCHIVOS -->
        <div class="space-y-2">
            <template x-for="item in fileItems" :key="item.id">
                <div class="card bg-base-100 border border-base-200 shadow-sm transition-all overflow-hidden">
                    <div class="p-3">
                        <div class="flex flex-col md:flex-row items-center justify-between gap-2">

                            <!-- Vista previa y datos iniciales -->
                            <div class="flex items-center gap-3 w-full md:w-auto min-w-0">
                                <div
                                    class="w-12 h-12 rounded-lg bg-base-300 flex-shrink-0 flex items-center justify-center overflow-hidden border border-base-200">
                                    <template x-if="item.dataUrl">
                                        <img :src="item.dataUrl" class="object-cover w-full h-full" />
                                    </template>
                                    <template x-if="!item.dataUrl">
                                        <i class="fa-solid fa-image text-lg text-base-content/30"></i>
                                    </template>
                                </div>
                                <div class="space-y-0.5 min-w-0">
                                    <h3 class="font-bold text-xs truncate max-w-[200px]" :title="item.name"
                                        x-text="item.name"></h3>
                                    <div class="flex flex-wrap gap-1.5 text-[10px] font-mono text-base-content/60">
                                        <span>Orig: <span x-text="formatBytes(item.originalSize)"></span> (<span
                                                x-text="item.origW"></span>x<span x-text="item.origH"></span>px)</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Resultados de salida y acciones -->
                            <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">

                                <div x-show="item.status === 'processing'"
                                    class="flex items-center gap-1.5 text-primary text-[11px] font-semibold">
                                    <span class="loading loading-spinner loading-xs"></span> Procesando...
                                </div>

                                <div x-show="item.status === 'error'"
                                    class="flex items-center gap-1 text-error text-[11px] font-bold">
                                    <i class="fa-solid fa-triangle-exclamation"></i> Error al procesar
                                </div>

                                <div x-show="item.status === 'done'" class="text-right font-mono">
                                    <div class="text-[11px] text-success font-bold">WebP: <span
                                            x-text="formatBytes(item.compressedSize)"></span></div>
                                    <div class="text-[10px] text-base-content/70"><span x-text="item.compW"></span> ×
                                        <span x-text="item.compH"></span> px</div>
                                    <div class="text-[10px] font-bold"
                                        :class="getItemSavings(item) >= 0 ? 'text-secondary' : 'text-error'">
                                        <span
                                            x-text="getItemSavings(item) >= 0 ? `-${getItemSavings(item)}%` : `+${Math.abs(getItemSavings(item))}%`"></span>
                                    </div>
                                </div>

                                <div class="flex items-center gap-1">
                                    <button @click="item.showEditPanel = !item.showEditPanel"
                                        class="btn btn-circle btn-xs"
                                        :class="item.showEditPanel ? 'btn-primary' : 'btn-ghost'"
                                        title="Editar ajustes individuales">
                                        <i class="fa-solid fa-sliders"></i>
                                    </button>

                                    <template x-if="item.status === 'done'">
                                        <a :href="item.dataUrl" :download="getWebPFilename(item.name)"
                                            class="btn btn-circle btn-xs btn-success text-white" title="Descargar WebP">
                                            <i class="fa-solid fa-download"></i>
                                        </a>
                                    </template>

                                    <button @click="removeItem(item.id)"
                                        class="btn btn-circle btn-xs btn-ghost text-error" title="Eliminar">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>

                            </div>
                        </div>
                    </div>

                    <!-- PANEL COLAPSABLE DE CONFIGURACIÓN INDIVIDUAL -->
                    <div x-show="item.showEditPanel" class="bg-base-200/70 p-3 border-t border-base-300 space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-[11px] font-bold text-primary flex items-center gap-1">
                                <i class="fa-solid fa-pen-to-square"></i> Configuración Individual
                            </span>
                            <button @click="resetItemToOriginal(item)" class="btn btn-xs btn-ghost text-[11px]">
                                Restablecer a Original
                            </button>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">

                            <!-- Redimensión Individual -->
                            <div class="space-y-1.5">
                                <label class="text-[11px] font-semibold block">Redimensión Inicial:</label>
                                <div class="form-control gap-0.5">
                                    <label class="label cursor-pointer justify-start gap-2 py-0.5 min-h-0">
                                        <input type="radio" value="original" x-model="item.resizeMode"
                                            @change="item.resizeMode = $event.target.value; applyItemResize(item)"
                                            class="radio radio-primary radio-xs" />
                                        <span class="label-text text-[11px]">Mantener Original (100%)</span>
                                    </label>
                                    <label class="label cursor-pointer justify-start gap-2 py-0.5 min-h-0">
                                        <input type="radio" value="percent" x-model="item.resizeMode"
                                            @change="item.resizeMode = $event.target.value; applyItemResize(item)"
                                            class="radio radio-primary radio-xs" />
                                        <span class="label-text text-[11px]">Escalar por Porcentaje (%)</span>
                                    </label>
                                    <label class="label cursor-pointer justify-start gap-2 py-0.5 min-h-0">
                                        <input type="radio" value="custom" x-model="item.resizeMode"
                                            @change="item.resizeMode = $event.target.value; applyItemResize(item)"
                                            class="radio radio-primary radio-xs" />
                                        <span class="label-text text-[11px]">Dimensiones Personalizadas (px)</span>
                                    </label>
                                </div>

                                <div x-show="item.resizeMode === 'percent'" class="space-y-1 pt-1">
                                    <label class="text-[11px] font-semibold">Porcentaje de Escala:</label>
                                    <div class="join w-full">
                                        <input type="number" x-model.number="item.percent" min="1" max="200"
                                            @change="applyItemResize(item)"
                                            class="input input-bordered input-xs w-full join-item font-mono" />
                                        <span class="btn btn-xs join-item border-base-300">%</span>
                                    </div>
                                </div>

                                <div x-show="item.resizeMode === 'custom'" class="space-y-1 pt-1">
                                    <div class="flex justify-between items-center">
                                        <label class="text-[11px] font-semibold">Ancho x Alto:</label>
                                        <button @click="item.keepAspect = !item.keepAspect" class="btn btn-xs gap-1"
                                            :class="item.keepAspect ? 'btn-primary' : 'btn-outline btn-warning'">
                                            <i class="fa-solid" :class="item.keepAspect ? 'fa-lock' : 'fa-lock-open'"></i>
                                            <span class="text-[10px]"
                                                x-text="item.keepAspect ? 'Mantener Proporción' : 'Libre (Deformar)'"></span>
                                        </button>
                                    </div>
                                    <div class="flex items-center gap-1.5">
                                        <div class="form-control w-full">
                                            <label class="label py-0"><span class="label-text-alt">Ancho (px)</span></label>
                                            <input type="number" x-model.number="item.targetW"
                                                @input="onIndivWidthChange(item)"
                                                class="input input-bordered input-xs w-full font-mono" />
                                        </div>
                                        <span class="mt-4 text-xs font-bold text-base-content/40">×</span>
                                        <div class="form-control w-full">
                                            <label class="label py-0"><span class="label-text-alt">Alto (px)</span></label>
                                            <input type="number" x-model.number="item.targetH"
                                                @input="onIndivHeightChange(item)"
                                                class="input input-bordered input-xs w-full font-mono" />
                                        </div>
                                    </div>
                                </div>

                                <div x-show="item.resizeMode === 'original'"
                                    class="text-[11px] text-base-content/60 italic">
                                    <i class="fa-solid fa-info-circle mr-1"></i> Respetará el tamaño nativo del archivo.
                                </div>
                            </div>

                            <!-- Calidad Individual -->
                            <div class="space-y-1.5">
                                <div class="flex justify-between items-center">
                                    <label class="text-[11px] font-semibold">Calidad WebP:</label>
                                    <span class="badge badge-primary font-mono text-[10px]"
                                        x-text="item.quality + '%'"></span>
                                </div>
                                <input type="range" min="10" max="100" x-model.number="item.quality"
                                    class="range range-primary range-xs mt-2" />
                            </div>

                        </div>

                        <div class="flex justify-end pt-1">
                            <button @click="processSingleItem(item)" class="btn btn-primary btn-xs gap-1">
                                <i class="fa-solid fa-rotate"></i> Re-convertir Imagen
                            </button>
                        </div>
                    </div>
                </div>
            </template>
        </div>

    </main>

    <!-- SCRIPT ALPINE COMPONENT -->
    <script>
        function compressorApp() {
            return {
                // Estado Global
                globalQuality: 82,
                globalResizeMode: 'original',
                globalPercent: 80,
                globalKeepAspect: true,
                globalCustomWidth: null,
                globalCustomHeight: null,
                isDropzoneActive: false,
                fileItems: [],

                // Propiedades Computadas
                get totalOriginalSize() {
                    return this.fileItems.reduce((acc, f) => acc + (f.originalSize || 0), 0);
                },
                get totalCompressedSize() {
                    return this.fileItems.reduce((acc, f) => acc + (f.compressedSize || 0), 0);
                },
                get totalSavings() {
                    const orig = this.totalOriginalSize;
                    const comp = this.totalCompressedSize;
                    if (orig > 0 && comp > 0) {
                        return (((orig - comp) / orig) * 100).toFixed(1);
                    }
                    return '0';
                },
                get hasDoneItems() {
                    return this.fileItems.some(f => f.status === 'done');
                },

                // Manejo de Archivos Nuevos
                async handleFilesAdded(filesObj) {
                    const validFiles = Array.from(filesObj).filter(f => f.type.startsWith('image/'));
                    if (!validFiles.length) return;

                    for (let file of validFiles) {
                        const nativeDims = await this.getImageDimensions(file);
                        const item = {
                            id: 'img_' + Math.random().toString(36).substr(2, 9),
                            file: file,
                            name: file.name,
                            originalSize: file.size,
                            origW: nativeDims.w,
                            origH: nativeDims.h,
                            targetW: nativeDims.w,
                            targetH: nativeDims.h,
                            resizeMode: this.globalResizeMode,
                            percent: this.globalPercent,
                            keepAspect: this.globalKeepAspect,
                            quality: this.globalQuality,
                            showEditPanel: false,
                            compressedBlob: null,
                            compressedSize: 0,
                            compW: 0,
                            compH: 0,
                            status: 'pending',
                            dataUrl: null
                        };

                        this.calculateInitialTargetDims(item);

                        // Agregar al array reactivo y obtener su referencia reactiva directa
                        this.fileItems.push(item);
                        const reactiveItem = this.fileItems[this.fileItems.length - 1];

                        this.processSingleItem(reactiveItem);
                    }
                },

                // Dimensiones Nativas (Usando ObjectURL en vez de FileReader)
                getImageDimensions(file) {
                    return new Promise((resolve) => {
                        const img = new Image();
                        const url = URL.createObjectURL(file);
                        img.onload = () => {
                            const dims = { w: img.width, h: img.height };
                            URL.revokeObjectURL(url);
                            resolve(dims);
                        };
                        img.onerror = () => {
                            URL.revokeObjectURL(url);
                            resolve({ w: 800, h: 600 });
                        };
                        img.src = url;
                    });
                },

                // Cálculo Inicial según Ajustes Globales
                calculateInitialTargetDims(item) {
                    item.resizeMode = this.globalResizeMode;
                    item.percent = this.globalPercent;
                    item.keepAspect = this.globalKeepAspect;
                    if (this.globalResizeMode === 'custom') {
                        item.targetW = parseInt(this.globalCustomWidth) || item.origW || 800;
                        item.targetH = parseInt(this.globalCustomHeight) || item.origH || 600;
                    }
                    this.applyItemResize(item);
                },

                // Aplica el modo de redimensión individual del item
                applyItemResize(item) {
                    const origW = item.origW || 800;
                    const origH = item.origH || 600;

                    if (item.resizeMode === 'percent') {
                        const factor = (parseFloat(item.percent) || 100) / 100;
                        item.targetW = Math.max(1, Math.round(origW * factor));
                        item.targetH = Math.max(1, Math.round(origH * factor));
                    } else if (item.resizeMode === 'custom') {
                        const reqW = parseInt(item.targetW);
                        const reqH = parseInt(item.targetH);

                        if (reqW && !reqH) {
                            item.targetW = reqW;
                            item.targetH = Math.round((origH / origW) * reqW);
                        } else if (!reqW && reqH) {
                            item.targetH = reqH;
                            item.targetW = Math.round((origW / origH) * reqH);
                        } else if (reqW && reqH) {
                            item.targetW = reqW;
                            item.targetH = item.keepAspect ? Math.round((origH / origW) * reqW) : reqH;
                        } else {
                            item.targetW = origW;
                            item.targetH = origH;
                        }
                    } else {
                        item.targetW = origW;
                        item.targetH = origH;
                    }
                },

                // Aplicar Globales
                async applyGlobalToAllFiles() {
                    for (let item of this.fileItems) {
                        item.quality = this.globalQuality;
                        this.calculateInitialTargetDims(item);
                        await this.processSingleItem(item);
                    }
                },

                // Procesamiento Individual
                async processSingleItem(item) {
                    item.status = 'processing';
                    try {
                        await this.compressCanvas(item);
                        item.status = 'done';
                    } catch (err) {
                        console.error("Error comprimiendo imagen:", err);
                        item.status = 'error';
                    }
                },

                // Núcleo de Compresión Canvas (Optimizado con URL.createObjectURL)
                compressCanvas(item) {
                    return new Promise((resolve, reject) => {
                        const img = new Image();
                        const objectUrl = URL.createObjectURL(item.file);

                        img.onload = () => {
                            URL.revokeObjectURL(objectUrl);

                            const w = Math.max(1, parseInt(item.targetW) || item.origW || 1);
                            const h = Math.max(1, parseInt(item.targetH) || item.origH || 1);

                            const canvas = document.createElement('canvas');
                            canvas.width = w;
                            canvas.height = h;

                            const ctx = canvas.getContext('2d');
                            ctx.imageSmoothingEnabled = true;
                            ctx.imageSmoothingQuality = 'high';
                            ctx.drawImage(img, 0, 0, w, h);

                            const quality = (parseInt(item.quality) || 82) / 100;

                            canvas.toBlob((blob) => {
                                if (!blob) return reject("Falló la conversión WebP");
                                item.compressedBlob = blob;
                                item.compressedSize = blob.size;
                                item.compW = canvas.width;
                                item.compH = canvas.height;
                                if (item.dataUrl) URL.revokeObjectURL(item.dataUrl);
                                item.dataUrl = URL.createObjectURL(blob);
                                resolve(item);
                            }, 'image/webp', quality);
                        };

                        img.onerror = (err) => {
                            URL.revokeObjectURL(objectUrl);
                            reject(err);
                        };

                        img.src = objectUrl;
                    });
                },

                // Handlers de cambio con aspecto bloqueado
                onIndivWidthChange(item) {
                    let w = parseInt(item.targetW);
                    if (!w || w < 1) return;
                    item.targetW = w;
                    if (item.keepAspect && item.origW > 0) {
                        const ratio = item.origH / item.origW;
                        item.targetH = Math.round(w * ratio);
                    }
                },

                onIndivHeightChange(item) {
                    let h = parseInt(item.targetH);
                    if (!h || h < 1) return;
                    item.targetH = h;
                    if (item.keepAspect && item.origH > 0) {
                        const ratio = item.origW / item.origH;
                        item.targetW = Math.round(h * ratio);
                    }
                },

                resetItemToOriginal(item) {
                    item.resizeMode = 'original';
                    item.percent = this.globalPercent;
                    item.targetW = item.origW;
                    item.targetH = item.origH;
                    item.quality = this.globalQuality;
                    item.keepAspect = true;
                    this.processSingleItem(item);
                },

                removeItem(id) {
                    const item = this.fileItems.find(f => f.id === id);
                    if (item && item.dataUrl) URL.revokeObjectURL(item.dataUrl);
                    this.fileItems = this.fileItems.filter(f => f.id !== id);
                },

                clearAll() {
                    this.fileItems.forEach(item => {
                        if (item.dataUrl) URL.revokeObjectURL(item.dataUrl);
                    });
                    this.fileItems = [];
                    if (this.$refs.fileInput) this.$refs.fileInput.value = '';
                },

                getItemSavings(item) {
                    if (!item.compressedSize || !item.originalSize) return 0;
                    return (((item.originalSize - item.compressedSize) / item.originalSize) * 100).toFixed(1);
                },

                getWebPFilename(name) {
                    const dotIdx = name.lastIndexOf('.');
                    const baseName = dotIdx !== -1 ? name.substring(0, dotIdx) : name;
                    return baseName + '.webp';
                },

                formatBytes(bytes, decimals = 2) {
                    if (!bytes || bytes === 0) return '0 Bytes';
                    const k = 1024;
                    const dm = decimals < 0 ? 0 : decimals;
                    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
                },

                async downloadAllZIP() {
                    const zip = new JSZip();
                    const folder = zip.folder("imagenes-webp");

                    this.fileItems.forEach(item => {
                        if (item.status === 'done' && item.compressedBlob) {
                            folder.file(this.getWebPFilename(item.name), item.compressedBlob);
                        }
                    });

                    const zipBlob = await zip.generateAsync({ type: "blob" });
                    saveAs(zipBlob, "imagenes_optimizadas_webp.zip");
                }
            }
        }
    </script>
